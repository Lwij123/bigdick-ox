<head>

<body>

    <img class="slide__img" src="photo1.jpg" alt="20 岁生日">

    <span class="slide__tag">23:06 · 20</span>

  <section class="slide" data-type="photo">

  <section class="slide" data-type="photo">
    <img class="slide__img" src="photo3.jpg" alt="20 岁生日">

  </section>

  <section class="slide" data-type="photo">

    <span class="slide__tag">23:07 · 笑一个</span>
  </section>

</main>

<button class="next" id="next" type="button">下一个<span class="next__arrow">›</span></button>

<audio id="bgm" loop preload="auto"></audio>
<script src="script.js"></script>
</body>
</html>
